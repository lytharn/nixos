# Set vi copy mode
setw -g mode-keys vi

# Forward terminal focus events to inner programs (e.g. lets Neovim's
# FocusGained fire so `autoread` reloads files changed on disk).
set -g focus-events on

# Close gaps in window numbering when a middle window is killed
set -g renumber-windows on

# Dismiss status messages quickly so they don't obscure the pane cursor.
set -g display-time 500

# Auto-restore the last saved tmux session when the server starts
set -g @continuum-restore 'on'

# Accept inbound OSC 52, not just emit it. The default `external` already
# hands copies out to the terminal, which is why a copy-mode `y` reaches the
# system clipboard -- but it drops the sequence when a program *inside* tmux
# sends one. A tmux session on a headless host (serx has no Wayland/X, so no
# clipboard of its own) is exactly such a program: its copies ride OSC 52 up
# the ssh connection, and the outer tmux here has to pass them along for them
# to land in the desktop's clipboard. Costs write-only exposure -- anything
# that can write to the terminal can set the clipboard -- but tmux never
# answers clipboard *read* queries, so this is not an exfiltration path.
set -g set-clipboard on

# Set status line
set -g status-justify "left"
set -g status "on"
set -g status-left-style "none"
set -g message-command-style "fg=colour0,bg=colour4"
set -g status-right-style "none"
set -g pane-active-border-style "fg=colour6,bold"
set -g status-style "none,bg=colour8"
set -g message-style "fg=colour0,bg=colour4"
set -g pane-border-style "fg=colour8"
set -g status-right-length "100"
set -g status-left-length "100"
setw -g window-status-activity-style "none"
setw -g window-status-separator ""
setw -g window-status-style "none,fg=colour7,bg=colour8"
set -g status-left "#[fg=colour0,bg=colour6] #S #[fg=colour6,bg=colour8]"
set -g status-right "#[fg=colour4,bg=colour8]#[fg=colour0,bg=colour4] %Y-%m-%d  %H:%M #[fg=colour6,bg=colour4]#[fg=colour0,bg=colour6] #h "
setw -g window-status-format "#[fg=colour7,bg=colour8] #I #[fg=colour7,bg=colour8] #W "
setw -g window-status-current-format "#[fg=colour8,bg=colour4]#[fg=colour0,bg=colour4] #I #[fg=colour0,bg=colour4] #W #[fg=colour4,bg=colour8]"

# Keybindings
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode-vi v send-keys -X begin-selection
